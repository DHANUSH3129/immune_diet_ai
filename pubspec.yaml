name: immune_diet_ai
description: Immune Diet AI - Personalized immunity nutrition app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  google_generative_ai: ^0.4.7
  file_picker: ^10.3.10
  path_provider: ^2.1.2
  flutter_pdfview: ^1.3.2

  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0

  # UI
  google_fonts: ^8.0.2
  curved_navigation_bar: ^1.0.3
  fl_chart: ^1.2.0
  lottie: ^3.0.0
  shimmer: ^3.0.0

  # Utils
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  provider: ^6.1.1
  image_picker: ^1.2.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
